name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROMPTFOO_VERSION: '0.122.0'

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # requirements-data.txt (datasets) is intentionally not installed:
      # only scripts/prepare_dataset.py needs it, and CI never runs it.
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Pytest suite
        run: pytest tests/
        env:
          PYTHONPATH: .

  validate:
    name: Validate Promptfoo configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-promptfoo-${{ env.PROMPTFOO_VERSION }}
          restore-keys: npm-promptfoo-

      - name: Install Promptfoo
        run: npm install -g promptfoo@${{ env.PROMPTFOO_VERSION }}

      - name: Validate Promptfoo configs
        run: |
          # Every experiment's config, so new experiments are covered automatically.
          find experiments -name "promptfooconfig.yaml" -print0 \
            | xargs -0 -I {} promptfoo validate config -c {}
