name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Promptfoo
        run: npm install -g promptfoo@0.122.0

      - name: Run Pytest suite
        run: pytest tests/
        env:
          PYTHONPATH: .

      - name: Validate Promptfoo Configs
        run: |
          # Find all promptfooconfig.yaml files and validate them
          find experiments -name "promptfooconfig.yaml" -print0 | xargs -0 -I {} promptfoo validate config -c {}
